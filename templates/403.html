<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied · Eventify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root{
    --warning:#F59E0B;
    --warning-dark:#B45309;
    --bg:#F8FAFC;
    --text:#111827;
    --text-light:#6B7280;
    --primary:#4F46E5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{max-width:520px;width:100%;text-align:center;}
  .badge{
    width:88px;
    height:88px;
    border-radius:24px;
    background:linear-gradient(135deg,var(--warning),var(--warning-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 28px;
    box-shadow:0 16px 40px rgba(245,158,11,.28);
  }
  .badge i{font-size:2.4rem;color:#fff;}
  .code{
    font-size:5rem;
    font-weight:800;
    line-height:1;
    letter-spacing:-2px;
    background:linear-gradient(135deg,var(--warning),var(--warning-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:.5rem;
  }
  h1{font-size:1.5rem;font-weight:700;margin-bottom:.75rem;}
  p{color:var(--text-light);margin-bottom:2rem;line-height:1.6;}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 24px;
    border-radius:12px;
    font-weight:600;
    font-size:.95rem;
    text-decoration:none;
    transition:.2s ease;
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.25);}
  .btn-primary:hover{background:#3730A3;transform:translateY(-1px);}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid #E5E7EB;}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><i class="bi bi-shield-lock"></i></div>
    <div class="code">403</div>
    <h1>You don't have access to this page</h1>
    <p>Your account doesn't have permission to view this resource. If you think this is a mistake, contact an administrator.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary"><i class="bi bi-house-door"></i> Go home</a>
      <a href="/dashboard/" class="btn btn-ghost"><i class="bi bi-speedometer2"></i> Dashboard</a>
    </div>
  </div>
</body>
</html>
