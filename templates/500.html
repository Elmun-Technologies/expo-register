<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Went Wrong · Eventify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
  :root{
    --danger:#DC2626;
    --danger-dark:#991B1B;
    --bg:#F8FAFC;
    --text:#111827;
    --text-light:#6B7280;
    --primary:#4F46E5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{max-width:520px;width:100%;text-align:center;}
  .badge{
    width:88px;
    height:88px;
    border-radius:24px;
    background:linear-gradient(135deg,var(--danger),var(--danger-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 28px;
    box-shadow:0 16px 40px rgba(220,38,38,.28);
  }
  .badge i{font-size:2.4rem;color:#fff;}
  .code{
    font-size:5rem;
    font-weight:800;
    line-height:1;
    letter-spacing:-2px;
    background:linear-gradient(135deg,var(--danger),var(--danger-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:.5rem;
  }
  h1{font-size:1.5rem;font-weight:700;margin-bottom:.75rem;}
  p{color:var(--text-light);margin-bottom:2rem;line-height:1.6;}
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 24px;
    border-radius:12px;
    font-weight:600;
    font-size:.95rem;
    text-decoration:none;
    background:var(--primary);
    color:#fff;
    box-shadow:0 8px 20px rgba(79,70,229,.25);
    transition:.2s ease;
  }
  .btn:hover{background:#3730A3;transform:translateY(-1px);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><i class="bi bi-exclamation-triangle"></i></div>
    <div class="code">500</div>
    <h1>Something went wrong on our end</h1>
    <p>Our team has been notified. Please try again in a moment — your data is safe.</p>
    <a href="/" class="btn"><i class="bi bi-house-door"></i> Go home</a>
  </div>
</body>
</html>
